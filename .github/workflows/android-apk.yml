name: Build Android APK

# Produces a sideloadable release APK from the Expo project in ./mobile.
# No Expo account and no local Android SDK needed — run it from the Actions tab,
# or let it run on pushes to main that touch the mobile app.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Branch builds let a feature branch produce a testable APK before merging.
      - 'arena/**'
    # `paths-ignore` cannot be combined with `paths`, so docs are excluded by negation.
    paths:
      - 'mobile/**'
      - '!**/*.md'
      - '.github/workflows/android-apk.yml'

concurrency:
  # Keyed by commit: builds for different pushes never cancel each other, and a
  # stuck run cannot block (or kill) the build for a newer commit.
  group: android-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # required to publish the APK as a release asset
    defaults:
      run:
        working-directory: mobile
    env:
      # Baked into the JS bundle so the app always knows its own build number;
      # version.json (published below) carries the same number for comparison.
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --watchAll=false

      - name: Stamp the build number
        # Without this every CI build is versionCode 1, which makes "install the newer
        # APK over the old one" ambiguous. The run number is monotonic per repo.
        run: |
          python3 - "$GITHUB_RUN_NUMBER" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("app.json")
          config = json.loads(path.read_text())
          android = config["expo"].setdefault("android", {})
          android["versionCode"] = int(sys.argv[1])
          path.write_text(json.dumps(config, indent=2) + "\n")
          print(f"android.versionCode = {android['versionCode']}")
          PY

      - name: Generate the native Android project
        run: npx expo prebuild -p android --no-install

      - name: Sign with the app's own keystore
        # Every APK has to carry the *same* signing certificate, or Android refuses
        # to install a new build over the old one and the library on the device is
        # lost with it. The generated project defaults to the runner's throwaway
        # debug key, which is different on every machine — so point the release
        # build at the key committed in mobile/keys instead.
        run: |
          python3 - <<'PY'
          import pathlib, re

          path = pathlib.Path("android/app/build.gradle")
          gradle = path.read_text()
          if "signingConfigs.release" in gradle:
              print("release signing already configured")
              raise SystemExit(0)

          config = '''
              release {
                  storeFile file('../../keys/atsu-offline.keystore')
                  storePassword 'atsuoffline'
                  keyAlias 'atsu'
                  keyPassword 'atsuoffline'
              }'''
          gradle = gradle.replace("signingConfigs {", "signingConfigs {" + config, 1)

          # Inside buildTypes the debug block comes first, so target the release
          # block rather than "the first debug signingConfig you find".
          match = re.search(r"buildTypes\s*\{[\s\S]*?release\s*\{", gradle)
          if not match:
              raise SystemExit("could not find the release build type in build.gradle")
          cut = match.end()
          gradle = gradle[:cut] + gradle[cut:].replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release",
              1,
          )
          path.write_text(gradle)
          print("release signing configured from mobile/keys/atsu-offline.keystore")
          PY

      - name: Install the NDK version React Native asks for
        # The runner image already ships an Android SDK, but not always the exact NDK
        # that react-native pins. Read it out of the generated project instead of
        # hard-coding a version that will drift with the next SDK upgrade.
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_VERSION=$(grep -rhoP 'ndkVersion\s*[:=]\s*"\K[0-9]+\.[0-9]+\.[0-9]+' \
            android/build.gradle android/app/build.gradle 2>/dev/null | head -1 || true)
          echo "project ndkVersion: ${NDK_VERSION:-<none>}"
          if [ -n "${NDK_VERSION}" ] && [ ! -d "$SDK/ndk/$NDK_VERSION" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi

      - name: Bundle the JS for release
        # Gradle shells out to exactly this command; running it separately turns a
        # vague "process node finished with exit code 1" into a readable error.
        id: bundle
        run: |
          set -o pipefail
          npx expo export:embed --platform android --dev false --entry-file index.ts \
            --bundle-output "$RUNNER_TEMP/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/res" 2>&1 | tee "$RUNNER_TEMP/bundle.log"

      - name: Report the bundling error
        if: failure() && steps.bundle.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          text = open(os.environ["RUNNER_TEMP"] + "/bundle.log", errors="replace").read()
          tail = "\n".join(text.strip().splitlines()[-30:])
          print("::error::expo export:embed failed: " + tail.replace("%", "%25").replace("\n", "%0A")[:3500])
          PY

      - name: Assemble release APK
        id: gradle
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Surface the Gradle failure
        # Actions logs sit behind a host some tooling cannot read; annotations are
        # always available, so push the interesting part of the build output there.
        if: failure() && steps.gradle.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          path = os.environ["RUNNER_TEMP"] + "/gradle.log"
          text = open(path, errors="replace").read()
          marker = "What went wrong"
          if marker in text:
              before, after = text.rsplit(marker, 1)
              head = "\n".join(before.strip().splitlines()[-25:])
              tail = "\n".join(after.strip().splitlines()[:8])
              detail = head + "\n--- what went wrong ---\n" + tail
          else:
              detail = "\n".join(text.strip().splitlines()[-40:])
          detail = detail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error::gradle failed: " + detail[:3500])
          PY

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore

      - name: Verify the APK signature
        # Printed so the signing certificate can be checked against the previous
        # build: same fingerprint means updates install over each other and keep
        # the library on the device.
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk \
            | tee "$RUNNER_TEMP/certs.txt"
          # The committed key's certificate. If this ever differs, an update would
          # be refused by Android (and take the user's library with it), so fail
          # the build instead of publishing an incompatible APK.
          EXPECTED=6b9813b858f09458e4dd7ed5d9668243da530a2dc60bfef31890a2225bd1ddb6
          grep -qi "$EXPECTED" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::APK is not signed with the app's stable key"; exit 1; }

      - name: Collect the APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/atsu-mobile.apk
          ls -lh artifacts/

      - name: Write version.json
        # The app reads this on launch to answer "is there a newer build?".
        # Same build number that was stamped into versionCode, so the comparison
        # in lib/updates.ts is exact.
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(pathlib.Path("app.json").read_text())["expo"]
          code = config["android"]["versionCode"]
          payload = {
              "version": config["version"],
              "versionCode": int(code),
              "apkUrl": "https://github.com/zxldetch/atsu-downloader/releases/download/mobile-latest/atsu-mobile.apk",
              "installUrl": "https://github.com/zxldetch/atsu-downloader/blob/main/mobile/INSTALL.md",
              "notes": f"CI build {code}",
              "publishedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          pathlib.Path("artifacts/version.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: atsu-mobile-apk
          path: |
            mobile/artifacts/atsu-mobile.apk
            mobile/artifacts/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK as a release asset
        # Release assets are downloadable without signing in, unlike workflow
        # artifacts — and the tag stays put, so the URL below never changes:
        #   https://github.com/<owner>/<repo>/releases/download/mobile-latest/atsu-mobile.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Sideloadable Android build from \`${GITHUB_SHA:0:7}\` (run #${{ github.run_number }}).
          Not a store release: signed with the debug keystore, for personal use.
          Install steps: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/mobile/INSTALL.md"
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release upload mobile-latest artifacts/atsu-mobile.apk artifacts/version.json --clobber
            gh release edit mobile-latest --title "Atsu Offline — latest APK" --notes "$NOTES"
          else
            gh release create mobile-latest artifacts/atsu-mobile.apk artifacts/version.json \
              --title "Atsu Offline — latest APK" \
              --notes "$NOTES" \
              --prerelease
          fi
